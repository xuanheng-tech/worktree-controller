name: Publish release
run-name: Release ${{ inputs.tag }} (${{ inputs.publish && 'publish' || 'audit' }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag integrated into main, such as v1.30.5
        required: true
        type: string
      publish:
        description: Publish matching artifacts; false performs a read-only destination audit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: wc-package-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'xuanheng-tech/worktree-controller' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact }}
      published: ${{ steps.bundle.outputs.published }}
    steps:
      - name: Set Python installation directory
        run: echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/project-python" >> "$GITHUB_ENV"
      - name: Checkout release automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Checkout exact payload tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
          python-version: "3.12"
          enable-cache: false
      - name: Check, build and freeze distributions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --no-env-file --python 3.12 python automation/scripts/release-project prepare \
            --source "$GITHUB_WORKSPACE/source" --tag "$RELEASE_TAG" \
            --work-dir "$RUNNER_TEMP/release-checks" --bundle "$RUNNER_TEMP/release-bundle"
      - name: Read-only destination audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --no-env-file --python 3.12 python automation/scripts/release-project audit \
            --bundle "$RUNNER_TEMP/release-bundle" | tee "$RUNNER_TEMP/release-audit.json"
      - name: Name immutable run artifact
        id: bundle
        run: |
          echo "artifact=release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          audit = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-audit.json").read_text())
          gh = audit["github"]
          complete = not audit["pypi_missing"] and gh["exists"] and not gh["draft"] and not gh["missing"]
          print(f"published={str(complete).lower()}")
          PY
      - name: Retain exact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 90
      - name: Retain check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-checks/checks.log
            ${{ runner.temp }}/release-checks/checks/pytest.xml
            ${{ runner.temp }}/release-audit.json
          if-no-files-found: warn

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
          python-version: "3.12"
          enable-cache: false
      - name: Download the checked bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: bundle
      - name: Reconcile and publish exact artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --no-env-file --python 3.12 python automation/scripts/release-project publish \
            --bundle "$GITHUB_WORKSPACE/bundle" | tee publication.json
      - name: Retain publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication.json
          if-no-files-found: warn

  verify:
    if: always() && needs.build.result == 'success' && ((inputs.publish && needs.publish.result == 'success') || (!inputs.publish && needs.build.outputs.published == 'true'))
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
          python-version: "3.12"
          enable-cache: false
      - name: Download the checked bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: bundle
      - name: Verify public downloads and fresh installs
        run: |
          uv run --no-project --no-env-file --python 3.12 python automation/scripts/release-project verify \
            --bundle "$GITHUB_WORKSPACE/bundle" --work-dir "$RUNNER_TEMP/fresh-installs" | tee verification.json
      - name: Retain verification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification.json
          if-no-files-found: warn
